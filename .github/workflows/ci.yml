name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate package and print pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.33.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for print validation
        run: pnpm exec playwright install --with-deps chromium
      - name: Type-check TypeScript
        run: pnpm article:check
      - name: Run unit, extraction fixture, EPUB, and print tests
        run: pnpm test
      - name: Build Astro output
        run: pnpm build
      - name: Audit release package contents
        run: pnpm release:package
      - name: Smoke-load Pi extension
        run: pnpm exec pi --no-skills -e . --list-models __pi_reads_package_smoke__
      - name: Audit production dependencies
        run: pnpm audit --prod
